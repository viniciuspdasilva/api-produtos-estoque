name: Pipeline CI - JAVA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:

  # ---------------------------------------------------
  # AÇÃO 1: BUILD (Garante que o código não tem erros)
  # ---------------------------------------------------
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest

    steps:
      # Passo 1: Baixa o código do repositório
      - name: Checkout
        uses: actions/checkout@v4

      # Passo 2: Instala o Java 25 no ambiente do GitHub
      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Passo 3: Executa o mvn clean install
      - name: Build com Maven
        run: mvn clean compile

  tests:
    name: 🧪 Testes Unitários[JaCoCo]
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Passo 4: Executa os testes automatizados do Quarkus e gera o relatório JaCoCo (em XML)
      - name: Testes unitarios
        run: mvn test

      # Passo 5.1: Salva o relatório como arquivo (Funciona sempre, em push ou PR)
      - name: Jacoco Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: ${{ github.workspace }}/target/site/jacoco/
          retention-days: 1
  # ---------------------------------------------------
  # AÇÃO 3: COBERTURA (Gera a tabela visual no resumo)
  # ---------------------------------------------------
  coverage:
    name: 📊 Cobertura de Código
    needs: tests # Espera os testes terminarem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Baixa o XML que foi gerado no job anterior
      - name: Baixar artefato do JaCoCo
        uses: actions/download-artifact@v4
        with:
          name: relatorio-xml
          path: target/jacoco-report/

      - name: Publicar Cobertura no Resumo
        continue-on-error: true
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: ${{ github.workspace }}/target/jacoco-report/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          title: "📊 Cobertura de Código (JaCoCo)"
    # ---------------------------------------------------
    # AÇÃO 3: CODEQL (Faz uma varredura de segurança basica)
    # ---------------------------------------------------
  analyze:
      name: Analyze (${{ matrix.language }})
      runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
      permissions:
        # required for all workflows
        security-events: write

        # required to fetch internal or private CodeQL packs
        packages: read

        # only required for workflows in private repositories
        actions: read
        contents: read
      needs: build
      strategy:
        fail-fast: false
        matrix:
          include:
            - language: actions
              build-mode: none
            - language: java-kotlin
              build-mode: none
      steps:
        - name: Checkout do código
          uses: actions/checkout@v4
        - name: Initialize CodeQL
          uses: github/codeql-action/init@v4
          with:
            languages: ${{ matrix.language }}
            build-mode: ${{ matrix.build-mode }}
        # If the analyze step fails for one of the languages you are analyzing with
        # "We were unable to automatically build your code", modify the matrix above
        # to set the build mode to "manual" for that language. Then modify this step
        # to build your code.
        # ℹ️ Command-line programs to run using the OS shell.
        # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
        - name: Run manual build steps
          if: matrix.build-mode == 'manual'
          shell: bash
          run: |
            echo 'If you are using a "manual" build mode for one or more of the' \
              'languages you are analyzing, replace this with the commands to build' \
              'your code, for example:'
            echo '  make bootstrap'
            echo '  make release'
            exit 1

        - name: Perform CodeQL Analysis
          uses: github/codeql-action/analyze@v4
          with:
            category: "/language:${{matrix.language}}"