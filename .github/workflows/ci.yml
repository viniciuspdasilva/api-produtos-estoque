name: Pipeline CI - API Produtos

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-tests:
    name: Build e Testes Unitários
    runs-on: ubuntu-latest

    steps:
      # Passo 1: Baixa o código do repositório
      - name: Checkout
        uses: actions/checkout@v4

      # Passo 2: Instala o Java 25 no ambiente do GitHub
      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Passo 3: Executa o mvn clean install
      - name: Build com Maven
        run: mvn clean install

      # Passo 4: Executa os testes automatizados do Quarkus e gera o relatório JaCoCo (em XML)
      - name: Testes unitarios
        run: mvn test

      # Passo 5: Lê o XML do JaCoCo e publica no Resumo do Workflow
      - name: Cobertura de Testes
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: ${{ github.workspace }}/target/jacoco-report/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          title: "📊 Cobertura de Código (JaCoCo)"

      # Passo 6: Garante que o projeto compila corretamente
      - name: Compilar projeto
        run: mvn package -DskipTests
