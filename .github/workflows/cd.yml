name: 2. Deployment Contínuo (CD Docker)

#Gatilhos
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["1. Integração Contínua (CI)"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    name: 🚀 Deploy na AWS
    runs-on: ubuntu-latest
    # ESSENCIAL: Só roda este job se o CI anterior teve sucesso ("success")
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Make java setup
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn package -DskipTests

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform apply
        working-directory: ./terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          terraform init
          terraform apply -auto-approve
          echo "EC2_IP=$(terraform output -raw instance_public_ip)" >> $GITHUB_ENV


      - name: ⏳ Aguardar inicialização do servidor
        run: |
          echo "Aguardando o servidor ${{ env.EC2_IP }} acordar..."
          tentativas=0
          max_tentativas=15
          
          # O comando 'nc' tenta conectar na porta 22. O 'while' cria um loop.
          while ! nc -zvw1 ${{ env.EC2_IP }} 22 2>/dev/null; do
            if [ $tentativas -ge $max_tentativas ]; then
              echo "❌ Timeout: A porta 22 não abriu após 3 minutos!"
              echo "Isso geralmente indica que o Security Group bloqueou o acesso ou a máquina falhou."
              exit 1 # Força o erro para cancelar o deploy e acionar o Rollback
            fi
            echo "Tentativa $((tentativas+1))/$max_tentativas - Porta ainda fechada. Tentando novamente..."
            sleep 5
            tentativas=$((tentativas+1))
          done
          
          echo "✅ Porta 22 aberta! O servidor está pronto para receber os arquivos."

      - name: Send archives from AWS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.EC2_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "target/quarkus-app,Dockerfile,deploy.sh"
          target: "/home/ubuntu/app"

      - name: Execute container
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ env.EC2_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "⏳ Aguardando a AWS finalizar a instalação do Docker..."
            cloud-init status --wait
            cd /home/ubuntu/app
            chmod +x deploy.sh
            ./deploy.sh

      # ---------------------------------------------------
      # MECANISMO DE ROLLBACK (Só executa em caso de erro)
      # ---------------------------------------------------
      - name: 🚨 Rollback
        if: failure()
        working-directory: ./terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          echo "Falha detectada no pipeline! Iniciando destruição da infraestrutura."
          terraform destroy -auto-approve
          echo "Rollback concluído com sucesso. A AWS não fará cobranças."